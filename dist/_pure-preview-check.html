<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>temporary PURE layout check</title><style>body{font:14px Arial;margin:16px;background:#eee}button{padding:10px;margin:4px}.frames{display:flex;gap:20px}iframe{border:1px solid #999;height:720px;background:white}pre{white-space:pre-wrap}</style><h1>temporary PURE layout check</h1><p>mobile viewports: 390 and 320 pixels</p><button onclick="show(0)">physical control</button><button onclick="show(1)">understanding the mind</button><button onclick="show(2)">responsibility</button><button onclick="show(3)">ego</button><button onclick="end()">chapter ending</button><pre id="result">loading</pre><div class="frames"><iframe title="390 pixel mobile preview" width="390" src="./#main-content" onload="ready()"></iframe><iframe title="320 pixel mobile preview" width="320" src="./#main-content" onload="ready()"></iframe></div><script>let selected=0;const frames=()=>Array.from(document.querySelectorAll('iframe'));function ready(){if(frames().every(f=>f.contentDocument.querySelectorAll('.pure-branch').length===4))show(0)}function show(i){selected=i;const results=[];frames().forEach(f=>{const d=f.contentDocument;const root=d.querySelector('.project-item');root.open=true;const chapters=[...d.querySelectorAll('.pure-branch')];chapters.forEach((ch,j)=>ch.open=j===i);chapters[i].querySelector('summary').scrollIntoView({block:'start'});const ps=[...chapters[i].querySelectorAll('.pure-branch-text')];results.push({width:f.contentWindow.innerWidth,chapter:chapters[i].querySelector('summary').textContent,paragraphs:ps.length,horizontalOverflow:d.documentElement.scrollWidth>f.contentWindow.innerWidth,allParagraphsInFlow:ps.every(p=>p.getBoundingClientRect().height>0),lastParagraph:ps.at(-1).textContent});});document.querySelector('#result').textContent=JSON.stringify(results,null,2)}function end(){frames().forEach(f=>{const ps=f.contentDocument.querySelectorAll('.pure-branch')[selected].querySelectorAll('p');ps[ps.length-1].scrollIntoView({block:'end'})})}</script></html>
