name: atelier-render

# Render worker for atelier (repository_dispatch from the app). Replaceable by an own server:
# it only needs the same payload, ffmpeg, python and a callback. Talking videos get the speech cut,
# mostly silent footage a 5–8 s montage (worker/montage.py).
on:
  repository_dispatch:
    types: [atelier-render]
  workflow_dispatch:
    inputs:
      payload:
        description: 'client payload json'
        required: true

permissions:
  contents: read

concurrency:
  group: atelier-render-${{ github.event.client_payload.postId || github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || github.event.inputs.payload }}
      WORK_DIR: ${{ github.workspace }}/work
    steps:
      # this file must live on the default branch (github only dispatches from there);
      # the worker code comes from the branch the app was deployed from
      - uses: actions/checkout@v4
        with:
          sparse-checkout: atelier
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: atelier/worker/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: install
        run: |
          pip install -r atelier/worker/requirements.txt

      - name: transcribe, select, cut, subtitle, render
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python atelier/worker/render.py

      - name: upload + report
        if: always()
        run: node atelier/worker/finish.mjs
