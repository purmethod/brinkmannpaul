name: cyclemax-ios

# Every push: compile the iOS app (simulator, unsigned) so Swift and project errors show up early.
# Manual run ("Run workflow"): archive, sign in the cloud and upload to TestFlight – no Mac needed.
# Secrets (repo → Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   – 10 characters, developer.apple.com → Membership
#   ASC_KEY_ID      – App Store Connect → Users and Access → Integrations → Keys (role Admin)
#   ASC_ISSUER_ID   – same page, above the key list
#   ASC_KEY_P8      – full content of the downloaded AuthKey_XXXX.p8
# Variable (optional): CYCLEMAX_API_BASE – backend URL, default https://cyclemax.app (deployed by cyclemax-web)

on:
  push:
    paths: ["cyclemax/**", ".github/workflows/cyclemax-ios.yml"]
  pull_request:
    paths: ["cyclemax/**", ".github/workflows/cyclemax-ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: cyclemax-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cyclemax
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cyclemax/package-lock.json
      - run: npm ci
      - name: Web build for the app
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.CYCLEMAX_API_BASE || 'https://cyclemax.app' }}
        run: |
          echo "Backend for the app: $NEXT_PUBLIC_API_BASE"
          npm run build
      - run: npx cap sync ios
      - run: xcodebuild -version

      - name: Compile (simulator, unsigned)
        if: env.UPLOAD != 'true'
        run: |
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing (see the header of this workflow)."; exit 1; fi
          done
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive
          xcodebuild -quiet -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          rm -f "$KEY"
          echo "Uploaded build $BUILD_NUMBER – it shows up in App Store Connect → TestFlight after processing (10–30 min)." >> "$GITHUB_STEP_SUMMARY"
