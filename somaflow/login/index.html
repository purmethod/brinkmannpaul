      if (!b) return null;
      const role = me.bio.role && (me.bio.role[lang] || me.bio.role.en);
      return el("div", { class: "read" + (me.written === "ready" ? "" : " old") },
        el("p", { class: "fine" }, t("hRead")),
        role ? el("p", { class: "fine", dir: "auto" }, role) : null,
        b.lead ? el("p", { class: "lead", dir: "auto" }, b.lead) : null,
        [b.bio, b.train, b.help].filter(Boolean).map((x) => el("p", { dir: "auto" }, x)),
        b.teaches ? [el("p", { class: "fine" }, b.teachesH), el("p", { dir: "auto" }, b.teaches)] : null,
        b.way ? [el("p", { class: "fine" }, b.wayH), el("p", { dir: "auto" }, b.way)] : null,
        b.quote ? el("p", { class: "q", dir: "auto" }, "“" + b.quote + "”") : null);
    }
    async function removeMe(form) {
      st.delError = "";
      try { await api("POST", { remove: { password: form.password.value } }); leave(); }
      catch (e) { if (e.status === 401) return leave(); st.delError = say(e); render(); }
    }
    async function password(form) {
      const old = form.old.value, next = form.next.value;
      st.pwNote = ""; st.pwError = "";
      if (next.length < 8) { st.pwError = t("errPw"); return render(); }
      try { const d = await api("POST", { password: { old, next } }); keep(d.token); st.pwNote = t("pwDone"); }
      catch (e) { if (e.status === 401) return leave(); st.pwError = say(e); }
      render();
    }
    // a photo: cut square from the middle, made small here, sent as a jpeg
    async function shrink(file) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
        const side = Math.min(img.naturalWidth, img.naturalHeight), size = Math.min(900, side);
        if (!side) throw new Error("empty");
        const cv = document.createElement("canvas"); cv.width = cv.height = size;
        cv.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
        let data = cv.toDataURL("image/jpeg", 0.84).split(",")[1];
        if (data.length > 1100000) data = cv.toDataURL("image/jpeg", 0.6).split(",")[1];
        return data;
      } finally { URL.revokeObjectURL(url); }
    }
    async function photo(slot, file) {
      if (st.picBusy) return;
      if (file === undefined) return;
      st.picBusy = slot; st.error = ""; st.note = ""; render();
      try { const d = await api("POST", { photo: file ? { slot, data: await shrink(file) } : { slot, remove: true } }); st.me = d.me; }
      catch (e) { if (e.status === 401) return leave(); st.error = e.code ? say(e) : t("errPhoto"); }
      st.picBusy = 0; render();
    }
    // where the teacher is: the device gives the point, the server turns it into town and country
    function locate() {
      if (st.locating) return;
      if (!navigator.geolocation) { st.error = t("errGeo"); return render(); }
      st.locating = true; st.error = ""; st.note = ""; render();
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try { const d = await api("POST", { locate: { lat: pos.coords.latitude, lon: pos.coords.longitude } }); st.me = d.me; st.d.city = d.me.city; st.d.country = d.me.country; st.note = t("saved"); }
        catch (e) { if (e.status === 401) return leave(); st.error = say(e); }
        st.locating = false; render();
      }, () => { st.locating = false; st.error = t("errGeo"); render(); }, { enableHighAccuracy: false, timeout: 20000, maximumAge: 600000 });
    }
    // speaking instead of typing, where the browser can turn speech into text
    let rec = null;
    function stopSpeech() { if (rec) { try { rec.stop(); } catch { /* already stopped */ } } rec = null; st.speaking = false; }
    function speech() {
      if (st.speaking) { stopSpeech(); return render(); }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      const r = new SR();
      r.lang = SPEECH[lang] || "en-US"; r.continuous = true; r.interimResults = false;
      r.onresult = (e) => {
        let said = "";
        for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) said += e.results[i][0].transcript;
        said = said.trim();
        if (!said) return;
        st.d.about = ((st.d.about || "").replace(/\s+$/, "") + " " + said).trim().slice(0, 1600);
        const box = document.getElementById("p-about");
        if (box) box.value = st.d.about;
      };
      const done = () => { if (rec === r) { rec = null; st.speaking = false; render(); } };
      r.onend = done; r.onerror = done;
      try { r.start(); rec = r; st.speaking = true; } catch { rec = null; st.speaking = false; }
      render();
    }

    function render() {
      // keep the place on the page and the field in use while the form is drawn again
      const y = window.scrollY, active = document.activeElement && document.activeElement.id;
      app.replaceChildren(...(st.view === "me" && st.me ? profile() : door()).flat(Infinity).filter((k) => k != null && k !== false));
      if (active) { const again = document.getElementById(active); if (again && again.tagName !== "BUTTON") again.focus({ preventScroll: true }); }
      window.scrollTo(0, y);
    }
    function setLang(l) {
      lang = l;
      try { sessionStorage.setItem("soma-flow-club-lang", l); } catch { /* private mode */ }
      document.documentElement.lang = l;
      document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      document.querySelectorAll(".lb").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
      document.title = t("hLogin") + " · foyo club";
      render();
    }
    document.querySelectorAll(".lb").forEach((b) => b.addEventListener("click", () => { stopSpeech(); setLang(b.dataset.lang); }));
    setLang(lang);
    if (st.token) api("GET").then(enter).catch((e) => { if (e.status === 401) keep(""); });
  })();
  </script>
</body>
</html>
