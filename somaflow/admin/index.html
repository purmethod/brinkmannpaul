<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>foyo club · anmeldungen</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --ink: #5c5c56; --ink3: #7b7b75; --line: #cfcfca; --warn: #8a3b2e; }
    body { background: #fff; color: var(--ink); font: 16px/1.6 Arial, Helvetica, sans-serif; text-transform: lowercase; }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    [hidden] { display: none !important; }
    nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 20px; border-top: 2px solid var(--ink); }
    nav img { height: 44px; width: auto; display: block; }
    main { max-width: 640px; margin: 0 auto; padding: 34px 20px 80px; }
    h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 400; letter-spacing: -.035em; line-height: 1.1; margin-bottom: 18px; }
    .tag { font-size: 12px; letter-spacing: .04em; color: var(--ink3); margin-bottom: 12px; }
    .fine { font-size: 13px; color: var(--ink3); }
    input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 0; font-size: 16px; text-transform: none; margin: 8px 0 14px; }
    .btn { padding: 14px 26px; border: 0; background: var(--ink); color: #fff; cursor: pointer; letter-spacing: .04em; }
    .ghost { padding: 7px 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; }
    .err { color: var(--warn); font-size: 14px; margin-top: 10px; }
    .session { margin-top: 34px; border-top: 2px solid var(--ink); padding-top: 14px; }
    .session h2 { font-size: 20px; font-weight: 400; letter-spacing: -.02em; }
    .count { font-size: 13px; color: var(--ink3); margin: 2px 0 10px; }
    ol { list-style: none; border-top: 1px solid var(--line); counter-reset: n; }
    li { counter-increment: n; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    li:before { content: counter(n); color: var(--ink3); font-size: 13px; }
    li .who { text-transform: none; }
    li .when { display: block; font-size: 12px; color: var(--ink3); }
    .empty { padding: 10px 0; color: var(--ink3); font-size: 14px; border-bottom: 1px solid var(--line); }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    li .bar { margin-top: 0; }
    a.ghost { color: var(--ink); text-decoration: none; }
    h3.wl { font-size: 12px; font-weight: 400; letter-spacing: .08em; color: var(--ink3); margin: 22px 0 8px; }
    /* the teachers' accounts: who registered, what they filled in, the address of their page */
    .acc { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .acc .who { text-transform: none; }
    .acc .when { display: block; font-size: 12px; color: var(--ink3); text-transform: none; }
    .acc .st { font-size: 12px; letter-spacing: .06em; color: var(--ink3); }
    .acc .st.wait { color: var(--warn); }
    .acc input[type=text] { width: 150px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 0; font-size: 14px; text-transform: none; }
    .acc details { margin-top: 8px; font-size: 14px; }
    .acc summary { cursor: pointer; color: var(--ink3); font-size: 13px; }
    .acc .prof { text-transform: none; white-space: pre-wrap; margin-top: 8px; }
    .acc .prof p { margin-bottom: 8px; }
    .acc .dots { display: flex; gap: 10px; margin: 10px 0; }
    .acc .dots img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  </style>
</head>
<body>
  <nav><a href="/"><img src="/foyo-club-black.webp?v=2" alt="foyo club" width="385" height="606" /></a><span class="fine">anmeldungen</span></nav>
  <main>
    <form id="login" hidden>
      <p class="tag">foyo club · admin</p>
      <h1>anmeldungen</h1>
      <label class="fine" for="key">passwort</label>
      <input type="password" id="key" autocomplete="current-password" />
      <button class="btn" type="submit">öffnen</button>
      <p class="err" id="lerr" hidden></p>
    </form>
    <section id="list" hidden>
      <p class="tag">foyo club · admin</p>
      <h1>anmeldungen</h1>
      <div class="bar"><button class="ghost" type="button" id="reload">neu laden</button><button class="ghost" type="button" id="out">abmelden</button></div>
      <p class="err" id="err" hidden></p>
      <div id="sessions"></div>
      <section class="session" id="teachers" hidden>
        <h2>lehrer</h2>
        <p class="count" id="tcount"></p>
        <p class="err" id="terr" hidden></p>
        <div id="accounts"></div>
        <p class="fine" style="margin-top:12px">lehrer registrieren sich unter myfoyo.com/login. ein profil ist erst nach deiner freigabe auf der seite. eine neue registrierung erscheint hier nach bis zu einer minute.</p>
      </section>
    </section>
  </main>
  <script>
  // the list of sign-ups for paul. the password is checked on the server (SOMA_ADMIN_KEY);
  // it is kept in this tab only, for this visit.
  (function () {
    "use strict";
    const K = "soma-admin";
    const $ = (id) => document.getElementById(id);
    let key = "";
    try { key = sessionStorage.getItem(K) || ""; } catch { /* private mode */ }
    function el(tag, attrs, ...kids) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); }
      for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
      return n;
    }
    const fmt = (iso, opts) => { try { return new Intl.DateTimeFormat("de-DE", opts).format(new Date(iso)); } catch { return iso; } };
    const sessionTitle = (s) => s.when ? fmt((s.when.length === 10 ? s.when + "T12:00" : s.when) + ":00Z", s.when.length === 10 ? { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" } : { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + (s.when.length === 10 ? " · uhrzeit in der gruppe" : "") : (s.id === "next" ? "nächster termin (ohne datum)" : "nächster termin · datum und uhrzeit in der gruppe");
    async function api(method, body) {
      const r = await fetch("https://brinkmannpaul.com/api/soma" + (method === "GET" ? "?admin=1" : ""), { method, cache: "no-store", headers: { "x-soma-key": key, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      if (r.status === 401) throw Object.assign(new Error("key"), { code: 401 });
      if (r.status === 429) throw Object.assign(new Error("locked"), { code: 429 });
      if (!r.ok) throw new Error("server");
      return r.json();
    }
    function show(which) { $("login").hidden = which !== "login"; $("list").hidden = which !== "list"; }
    async function load() {
      $("err").hidden = true;
      try {
        const d = await api("GET");
        show("list");
        const box = $("sessions"); box.replaceChildren();
        if (!d.sessions.length) box.append(el("p", { class: "empty" }, "noch keine termine und keine anmeldungen."));
        for (const s of d.sessions) {
          const list = el("ol");
          if (!s.people.length) list.append(el("p", { class: "empty" }, "noch niemand angemeldet."));
          for (const p of s.people) list.append(el("li", {},
            el("span", {}, el("span", { class: "who" }, p.name), el("span", { class: "when" }, "angemeldet " + fmt(p.joined, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + (p.price ? " · " + p.price + " dinar" : ""))),
            el("button", { class: "ghost", type: "button", onclick: () => remove(p) }, "austragen")));
          // the waiting list: whoever is first hears first, by whatsapp
          const waiting = s.waiting || [];
          const wl = el("ol");
          for (const p of waiting) {
            const digits = String(p.phone || "").replace(/\D/g, "");
            const text = "hallo " + p.name + ", bei foyo club ist ein platz frei geworden. möchtest du kommen?";
            wl.append(el("li", {},
              el("span", {}, el("span", { class: "who" }, p.name), el("span", { class: "when" }, (p.phone || "") + " · eingetragen " + fmt(p.joined, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))),
              el("span", { class: "bar" },
                digits ? el("a", { class: "ghost", href: "https://wa.me/" + digits + "?text=" + encodeURIComponent(text), target: "_blank", rel: "noopener" }, "whatsapp") : null,
                el("button", { class: "ghost", type: "button", onclick: () => remove(p) }, "austragen"))));
          }
          box.append(el("section", { class: "session" },
            el("h2", {}, sessionTitle(s) + (s.test ? " · test" : "")),
            el("p", { class: "count" }, (s.place ? s.place + " · " : "") + s.people.length + " von " + d.places + " plätzen belegt" + (waiting.length ? " · " + waiting.length + " auf der warteliste" : "")),
            list,
            waiting.length ? el("h3", { class: "wl" }, "warteliste") : null,
            waiting.length ? wl : null));
        }
        teachers();
      } catch (e) {
        if (e.code === 429) { key = ""; try { sessionStorage.removeItem(K); } catch {} show("login"); $("lerr").textContent = "zu viele falsche versuche. in 15 minuten geht es wieder."; $("lerr").hidden = false; return; }
        if (e.code === 401) { key = ""; try { sessionStorage.removeItem(K); } catch {} show("login"); $("lerr").textContent = "das passwort stimmt nicht."; $("lerr").hidden = false; return; }
        show("list"); $("err").textContent = "die liste konnte nicht geladen werden. bitte neu laden."; $("err").hidden = false;
      }
    }
    // ---------- the teachers: confirm a profile, take it off the site, give a new password, delete ----------
    async function tapi(method, body) {
      const r = await fetch("https://brinkmannpaul.com/api/teacher", { method, cache: "no-store", headers: { "x-soma-key": key, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(d.error || "server"), { code: d.error || "server" });
      return d;
    }
    const terr = (msg) => { $("terr").textContent = msg; $("terr").hidden = !msg; };
    async function teachers() {
      let d;
      try { d = await tapi("GET"); } catch { $("teachers").hidden = false; terr("die lehrer konnten nicht geladen werden."); return; }
      $("teachers").hidden = false; terr("");
      const box = $("accounts"); box.replaceChildren();
      const waiting = d.accounts.filter((a) => a.status !== "active").length;
      $("tcount").textContent = d.accounts.length + " konten" + (waiting ? " · " + waiting + " warten auf freigabe" : "");
      if (!d.accounts.length) box.append(el("p", { class: "empty" }, "noch kein lehrer registriert."));
      for (const a of d.accounts) {
        const live = a.status === "active";
        const slug = el("input", { type: "text", value: a.slug, "aria-label": "adresse der seite", autocapitalize: "none", spellcheck: "false" });
        const facts = [
          a.role, [a.city, a.country].filter(Boolean).join(", "), a.ig ? "instagram @" + a.ig : "", a.wa ? "whatsapp " + a.wa : "",
          a.priceClass ? "stunde " + a.priceClass : "", a.pay && a.pay.length ? "bezahlung " + a.pay.join(" + ") : "",
          ...(a.retreats || []).map((r) => "retreat: " + [r.title, [r.from, r.to].filter(Boolean).join(" bis "), r.place, r.price].filter(Boolean).join(" · "))].filter(Boolean);
        // the written profile, in german, as the page shows it; under it the teacher's own words
        const b = a.bio && a.bio.bio && (a.bio.bio.de || a.bio.bio.en);
        const state = a.written === "ready" ? "steckbrief geschrieben" : a.written === "stale" ? "steckbrief noch nicht geschrieben oder veraltet" : "noch zu wenig text für einen steckbrief";
        const photos = (a.photos || []).filter(Boolean);
        box.append(el("div", { class: "acc" },
          el("span", { class: "who" }, a.name), " ", el("span", { class: "st" + (live ? "" : " wait") }, live ? "· online" : "· wartet auf freigabe"),
          el("span", { class: "when" }, a.email + " · registriert " + fmt(a.joined, { day: "2-digit", month: "2-digit", year: "numeric" })),
          el("details", {}, el("summary", {}, "profil ansehen"),
            el("div", { class: "prof" },
              photos.length ? el("div", { class: "dots" }, photos.map((u) => el("img", { src: u, alt: "", loading: "lazy" }))) : el("p", { class: "fine" }, "noch keine fotos."),
              facts.map((f) => el("p", {}, f)),
              el("p", { class: "fine" }, state),
              b ? [b.lead, b.bio, b.train, b.help, b.teaches ? b.teachesH + ": " + b.teaches : "", b.way ? b.wayH + ": " + b.way : "", b.quote ? "„" + b.quote + "“" : ""].filter(Boolean).map((x) => el("p", {}, x)) : null,
              a.about ? [el("p", { class: "fine" }, "eigene worte des lehrers:"), el("p", {}, a.about)] : el("p", { class: "fine" }, "noch kein text."))),
          el("div", { class: "bar" },
            el("span", { class: "fine" }, "myfoyo.com/"), slug,
            el("button", { class: "ghost", type: "button", onclick: () => tdo({ approve: a.id, slug: slug.value.trim() }) }, live ? "adresse ändern" : "freigeben"),
            live ? el("a", { class: "ghost", href: "/" + a.slug, target: "_blank", rel: "noopener" }, "seite öffnen") : null,
            live ? el("button", { class: "ghost", type: "button", onclick: () => tdo({ block: a.id }) }, "von der seite nehmen") : null,
            a.written !== "none" ? el("button", { class: "ghost", type: "button", onclick: (e) => { e.target.textContent = "wird geschrieben … (halbe minute)"; e.target.disabled = true; tdo({ build: a.id }); } }, "steckbrief neu schreiben") : null,
            el("button", { class: "ghost", type: "button", onclick: () => reset(a) }, "neues passwort"),
            el("button", { class: "ghost", type: "button", onclick: () => { if (confirm(a.name + " löschen? das konto und das profil sind dann weg.")) tdo({ remove: a.id }); } }, "löschen"))));
      }
    }
    const TMSG = { write: "der steckbrief konnte gerade nicht geschrieben werden. bitte versuch es gleich noch einmal.", about: "der lehrer hat noch zu wenig über sich geschrieben.", slug: "diese adresse geht nicht. nur kleine buchstaben, zahlen und bindestriche, und kein name einer eigenen seite wie admin oder login.", taken: "diese adresse hat schon ein anderer lehrer." };
    async function tdo(body) {
      try { await tapi("POST", body); terr(""); } catch (e) { terr(TMSG[e.code] || "das hat nicht geklappt."); if (body.build) teachers(); return; }
      // the list comes from stripe's search, which sees a change after a moment
      setTimeout(teachers, 2500);
    }
    async function reset(a) {
      if (!confirm("neues passwort für " + a.name + "? das alte gilt dann nicht mehr.")) return;
      try { const d = await tapi("POST", { reset: a.id }); prompt("neues passwort für " + a.name + " (schick es per whatsapp):", d.password); } catch { terr("das hat nicht geklappt."); }
    }
    async function remove(p) {
      if (!confirm(p.name + (p.wait ? " von der warteliste nehmen?" : " austragen? der platz wird wieder frei."))) return;
      try { await api("POST", { remove: p.id }); load(); } catch { $("err").textContent = "das hat nicht geklappt."; $("err").hidden = false; }
    }
    $("login").addEventListener("submit", (e) => {
      e.preventDefault();
      key = $("key").value.trim();
      if (!key) return;
      try { sessionStorage.setItem(K, key); } catch {}
      $("lerr").hidden = true;
      load();
    });
    $("reload").addEventListener("click", load);
    $("out").addEventListener("click", () => { key = ""; try { sessionStorage.removeItem(K); } catch {} $("key").value = ""; show("login"); });
    if (key) load(); else show("login");
  })();
  </script>
</body>
</html>
