<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --ink: #5c5c56; --ink3: #7b7b75; --line: #cfcfca; --line2: #e4e4e0; --warn: #8a3b2e; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: #fff; color: var(--ink); font: 16px/1.6 Arial, Helvetica, sans-serif; text-transform: lowercase; }
    button, input { font: inherit; color: inherit; text-transform: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    [hidden] { display: none !important; }

    /* the opening: the videos, full screen, the logo as a white watermark */
    .flow { position: relative; height: 100vh; height: 100svh; overflow: hidden; cursor: pointer; background: #e9e3d8 url(/poster2.webp?v=1) center 40% / cover no-repeat; }
    .flow video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; pointer-events: none; }
    .flow:before { content: ""; position: absolute; inset: 0 0 auto; height: 48%; z-index: 1; background: linear-gradient(rgba(25, 22, 18, .42), rgba(25, 22, 18, 0)); }
    .flow:after { content: ""; position: absolute; inset: auto 0 0; height: 22%; z-index: 1; background: linear-gradient(rgba(25, 22, 18, 0), rgba(25, 22, 18, .28)); }
    .mark { position: absolute; z-index: 2; left: 50%; top: max(8vh, calc(env(safe-area-inset-top) + 34px)); width: min(42vw, 280px); transform: translateX(-50%); display: grid; justify-items: center; gap: 14px; filter: drop-shadow(0 1px 14px rgba(0, 0, 0, .22)); }
    .mark img { width: 100%; height: auto; display: block; }
    /* the line under the logo may be wider than the logo: it never changes the logo's size, it stays centred */
    .mark { grid-template-columns: minmax(0, 1fr); }
    .motto { color: #fff; font-size: 11px; letter-spacing: .3em; padding-inline-start: .3em; white-space: nowrap; justify-self: center; width: max-content; }
    .cue { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); display: grid; justify-items: center; gap: 8px; color: #fff; font-size: 12px; letter-spacing: .12em; text-shadow: 0 0 10px rgba(0, 0, 0, .35); }
    .cue i { width: 1px; height: 34px; background: rgba(255, 255, 255, .85); animation: drift 2.6s ease-in-out infinite; transform-origin: top; }
    @keyframes drift { 0%, 100% { transform: scaleY(.35); opacity: .5; } 50% { transform: scaleY(1); opacity: 1; } }

    /* the page: the same calm as pure, pact and the wim hof page */
    nav.top { position: sticky; top: 0; z-index: 10; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: #fff; border-top: 2px solid var(--ink); }
    .home { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
    .home img { height: 44px; width: auto; }
    .lsw { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .lb { background: #fff; border: 1px solid var(--line); cursor: pointer; padding: 3px 8px; font-size: 13px; min-width: 32px; }
    .lb[aria-pressed=true] { border-color: var(--ink); }
    main { max-width: 640px; margin: 0 auto; padding: 44px 20px 80px; outline: none; }
    .tag { font-size: 12px; letter-spacing: .04em; color: var(--ink3); margin-bottom: 14px; }
    h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.08; margin-bottom: 18px; font-weight: 400; letter-spacing: -.035em; }
    h2 { font-size: 12px; font-weight: 400; letter-spacing: .08em; color: var(--ink3); margin: 34px 0 10px; }
    .lead { font-size: 18px; margin-bottom: 22px; }
    .fine { font-size: 13px; color: var(--ink3); margin: 14px 0; }
    .rows { border-top: 1px solid var(--line); }
    .slot { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: #fff; text-align: start; cursor: pointer; text-transform: lowercase; }
    .slot .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--ink); }
    .slot[aria-checked=true] .dot { background: var(--ink); }
    .slot .place { display: block; font-size: 13px; color: var(--ink3); }
    .slot .left { font-size: 13px; color: var(--ink3); white-space: nowrap; }
    .slot:disabled { cursor: default; opacity: .45; }
    .form { display: grid; gap: 8px; margin: 26px 0 18px; }
    .form label { font-size: 13px; color: var(--ink3); }
    .form .hint { font-size: 15px; margin-bottom: 8px; }
    input[type=text], input[type=tel] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 0; background: #fff; font-size: 16px; }
    .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); opacity: 0; pointer-events: none; }
    .btn { display: inline-block; padding: 14px 26px; border: 0; background: var(--ink); color: #fff; cursor: pointer; letter-spacing: .04em; text-decoration: none; text-align: center; }
    .btn:disabled { opacity: .35; cursor: default; }
    .ghost { display: inline-block; padding: 13px 20px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-decoration: none; text-align: center; }
    .err { color: var(--warn); font-size: 14px; margin-top: 12px; }
    .done { border-top: 2px solid var(--ink); padding-top: 22px; }
    .when { font-size: clamp(22px, 5vw, 30px); line-height: 1.2; margin: 8px 0 4px; letter-spacing: -.02em; }
    .rules { list-style: none; border-top: 1px solid var(--line); margin: 24px 0; }
    .rules li { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .acts { display: grid; gap: 10px; margin-top: 22px; }
    .acts .btn, .acts .ghost { width: 100%; }
    a.ghost { color: var(--ink); }
    .acts.leave { margin-top: 34px; }
    .acts.leave .ghost { color: var(--ink3); font-size: 14px; }
    .slot:has(+ .where) { border-bottom: 0; }
    .where { padding: 0 0 14px; padding-inline-start: 34px; margin-top: -6px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink3); }
    .where a { color: var(--ink); }
    .done .where { padding: 0; margin: 2px 0 0; border: 0; font-size: 15px; }
    /* about paul: the circles of the wim hof page */
    .about { max-width: 640px; margin: 0 auto; padding: 10px 20px 70px; border-top: 1px solid var(--line); }
    .about .tag { margin-top: 34px; }
    .about p { margin-bottom: 1.05em; }
    .about .lead { margin: 6px 0 18px; }
    .wide { margin: 18px 0; }
    .wide img { display: block; width: 100%; height: auto; }
    .photo { display: grid; justify-items: center; gap: 14px; margin: 26px 0 30px; }
    .photo-circle { position: relative; display: block; width: min(240px, 68vw); aspect-ratio: 1; border-radius: 50%; }
    .photo-circle img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .photo-circle:after { content: ""; position: absolute; inset: -7px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); }
    .photo figcaption { font-size: 12px; letter-spacing: .035em; color: var(--ink3); }
    /* the wim hof method: four numbers, then the studies */
    .facts { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); margin: 26px 0 8px; }
    .facts div { padding: 16px 0 14px; border-bottom: 1px solid var(--line); }
    .facts div:nth-child(odd) { padding-inline-end: 14px; }
    .facts div:nth-child(even) { padding-inline-start: 14px; border-inline-start: 1px solid var(--line); }
    .facts dt { font-size: clamp(26px, 6vw, 34px); line-height: 1.1; letter-spacing: -.02em; text-align: start; }
    [dir=rtl] .facts dt { text-align: right; }
    .facts dd { font-size: 12px; color: var(--ink3); margin-top: 6px; }
    .wim sup { font-size: 10px; line-height: 0; }
    .wim sup + sup:before { content: ","; color: var(--ink3); }
    .wim sup a { color: var(--ink3); text-decoration: none; padding: 0 1px; }
    .wim .pillar { font-size: clamp(22px, 5vw, 28px); font-weight: 400; letter-spacing: -.02em; line-height: 1.2; margin: 44px 0 12px; padding-top: 20px; border-top: 1px solid var(--ink); }
    .wim .why { margin-top: 44px; }
    .wim .safe { margin: 22px 0 6px; }
    .src { padding-inline-start: 18px; font-size: 12px; line-height: 1.5; color: var(--ink3); text-transform: none; }
    .src li { margin-bottom: 8px; scroll-margin-top: 80px; }
    .src a { color: var(--ink3); word-break: break-all; }
    .about .sign { margin-top: 26px; color: var(--ink3); letter-spacing: .04em; }
    /* the team: one circle per teacher, three in a row, each opens the teacher's own page */
    .team { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 14px; margin: 30px 0 10px; padding-top: 28px; border-top: 1px solid var(--line); }
    .member { display: grid; justify-items: center; align-content: start; gap: 12px; text-align: center; text-decoration: none; color: var(--ink); }
    .member .ring { position: relative; display: block; width: 100%; max-width: 150px; aspect-ratio: 1; border-radius: 50%; background: var(--line2); }
    .member .ring img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .member .ring:after { content: ""; position: absolute; inset: -5px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); }
    .member .nm { font-size: 14px; line-height: 1.3; }
    .member .rl { display: block; font-size: 12px; color: var(--ink3); margin-top: 2px; }
    .member.soon { color: var(--ink3); }
    a.member:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
    /* who leads the session: a small circle and the name */
    .with { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: 14px; margin: 2px 0 12px; }
    .with img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    /* a teacher's own page */
    .teacher { display: grid; justify-items: center; text-align: center; gap: 6px; }
    .teacher .photo { margin: 6px 0 10px; }
    .teacher h1 { margin: 0; }
    .teacher .rl { color: var(--ink3); font-size: 14px; letter-spacing: .04em; }
    .teacher .acts { width: 100%; margin-top: 26px; }
    .fine.by { margin: -10px 0 22px; letter-spacing: .04em; }
    h1.claim { font-size: clamp(24px, 5.4vw, 32px); line-height: 1.2; letter-spacing: -.02em; }
    .quote { margin: 34px 0 6px; padding-top: 24px; border-top: 1px solid var(--ink); }
    .quote p { font-size: clamp(20px, 4.6vw, 26px); line-height: 1.25; letter-spacing: -.02em; }
    .quote cite { display: block; margin-top: 10px; font-size: 12px; font-style: normal; letter-spacing: .04em; color: var(--ink3); }
    .proof { width: 100%; margin: 22px 0 4px; }
    .proof img { display: block; width: 100%; height: auto; }
    .proof figcaption { margin-top: 10px; font-size: 12px; letter-spacing: .035em; color: var(--ink3); }
    .igs { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 8px; margin-top: 16px; color: var(--ink3); font-size: 14px; }
    .igs a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink3); font-size: 14px; text-decoration: none; text-transform: none; }
    .back { font-size: 13px; color: var(--ink3); text-decoration: none; }
    .mine { display: grid; gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .mine .ghost { width: 100%; }
    footer { max-width: 640px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 12px; color: var(--ink3); border-top: 1px solid var(--line); }
    footer .by { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer .ig { color: inherit; line-height: 0; flex: none; }
    @media (prefers-reduced-motion: reduce) { .cue i { animation: none; } }
  </style>
</head>
